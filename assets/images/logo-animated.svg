<svg width="100" height="100" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="logo-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#6366f1;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#ec4899;stop-opacity:1" />
    </linearGradient>
    <style>
      @keyframes split-top-left {
        0%, 100% { transform: translate(0, 0); }
        50% { transform: translate(-4px, -4px); }
      }
      @keyframes split-top-right {
        0%, 100% { transform: translate(0, 0); }
        50% { transform: translate(4px, -4px); }
      }
      @keyframes split-bottom-left {
        0%, 100% { transform: translate(0, 0); }
        50% { transform: translate(-4px, 4px); }
      }
      @keyframes split-bottom-right {
        0%, 100% { transform: translate(0, 0); }
        50% { transform: translate(4px, 4px); }
      }
      .part { fill: url(#logo-grad); transition: all 0.3s ease; }
      .tl { animation: split-top-left 3s infinite ease-in-out; }
      .tr { animation: split-top-right 3s infinite ease-in-out; }
      .bl { animation: split-bottom-left 3s infinite ease-in-out; }
      .br { animation: split-bottom-right 3s infinite ease-in-out; }
    </style>
  </defs>
  
  <!-- The "Photo" splitting into 4 parts -->
  <rect class="part tl" x="15" y="15" width="33" height="33" rx="4" />
  <rect class="part tr" x="52" y="15" width="33" height="33" rx="4" />
  <rect class="part bl" x="15" y="52" width="33" height="33" rx="4" />
  <rect class="part br" x="52" y="52" width="33" height="33" rx="4" />

  <!-- A subtle lens/flash effect in the center -->
  <circle cx="50" cy="50" r="8" fill="white" fill-opacity="0.2">
    <animate attributeName="r" values="8;12;8" dur="3s" repeatCount="indefinite" />
    <animate attributeName="fill-opacity" values="0.2;0.5;0.2" dur="3s" repeatCount="indefinite" />
  </circle>
</svg>
