name: Automated Product Scraper

on:
  schedule:
    - cron: '0 0 * * *' # Runs daily at midnight UTC
  workflow_dispatch: # Allows manual triggering from the GitHub Actions UI

jobs:
  scrape-and-update:
    runs-on: ubuntu-latest
    
    # We need permission to push to the repo
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci || npm install

      - name: Run Puppeteer Scraper
        run: node scripts/update-products.js

      - name: Commit and Push Changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add js/amazon-products.js
          
          # Only commit if there are changes
          if ! git diff-index --quiet HEAD; then
            git commit -m "chore(products): automated update of product images and deadlinks"
            git push
          else
            echo "No changes to commit."
          fi
