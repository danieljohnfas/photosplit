name: Deploy to Cloudflare

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    name: Deploy
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Deploy to Cloudflare Workers (Static Assets)
        run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: 9213ae688946caea617ba6fd5e4fbc5c

      - name: Ensure www CNAME DNS record in Cloudflare
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          ZONE_RES=$(curl -s -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" "https://api.cloudflare.com/client/v4/zones?name=photosplitstudio.com")
          ZONE_ID=$(echo "$ZONE_RES" | jq -r '.result[0].id // empty')
          if [ -n "$ZONE_ID" ]; then
            echo "Found Zone ID: $ZONE_ID"
            REC_RES=$(curl -s -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" "https://api.cloudflare.com/client/v4/zones/$ZONE_ID/dns_records?name=www.photosplitstudio.com")
            REC_COUNT=$(echo "$REC_RES" | jq -r '.result | length')
            if [ "$REC_COUNT" = "0" ]; then
              echo "Creating CNAME record for www.photosplitstudio.com..."
              CREATE_RES=$(curl -s -X POST "https://api.cloudflare.com/client/v4/zones/$ZONE_ID/dns_records" \
                -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
                -H "Content-Type: application/json" \
                --data '{"type":"CNAME","name":"www","content":"photosplitstudio.com","ttl":1,"proxied":true}')
              echo "Create response: $(echo "$CREATE_RES" | jq -r '.success // false')"
            else
              echo "www DNS record already exists."
            fi
          else
            echo "Zone photosplitstudio.com lookup returned no zone ID with this token."
          fi
