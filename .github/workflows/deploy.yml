name: Deploy to Cloudflare

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    name: Deploy
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Deploy to Cloudflare Workers (Static Assets)
        run: |
          npx wrangler deploy > wrangler_output.log 2>&1
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: 9213ae688946caea617ba6fd5e4fbc5c

      - name: Upload Wrangler Log on Failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: wrangler-log
          path: wrangler_output.log
