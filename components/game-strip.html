<!-- GAME STRIP COMPONENT -->
<div class="game-strip-container" style="max-width: 860px; margin: 40px auto; padding: 0 24px;">
  <div class="glass-ad-panel" style="padding: 16px; border: 1px solid var(--border-strong); display: flex; flex-direction: column; gap: 12px; background: var(--bg-surface-2);">
    <div style="display: flex; justify-content: space-between; align-items: center;">
      <h3 style="margin: 0; font-size: 1.1rem; display: flex; align-items: center; gap: 8px;">
        🎮 Take a Break & Play!
      </h3>
      <button onclick="shuffleGame()" class="btn btn-secondary btn-sm" style="padding: 6px 12px; border-radius: 20px; font-size: 0.8rem;">
        🎲 Shuffle Game
      </button>
    </div>
    <div style="position: relative; padding-bottom: 56.25%; height: 0; overflow: hidden; border-radius: 8px; background: var(--bg-sunken);">
      <iframe 
        id="mini-game-frame"
        style="position: absolute; top: 0; left: 0; width: 100%; height: 100%; border: none;"
        allow="gamepad *;"
        scrolling="no"
        frameborder="0"
      ></iframe>
    </div>
    <p style="margin: 0; font-size: 0.75rem; color: var(--text-muted); text-align: center;">
      Free mini-games provided by CrazyGames. Play right in your browser.
    </p>
  </div>
</div>

<script>
  const gamePool = [
    "https://www.crazygames.com/embed/2048",
    "https://www.crazygames.com/embed/uno-online",
    "https://www.crazygames.com/embed/smash-karts",
    "https://www.crazygames.com/embed/cubes-2048-io",
    "https://www.crazygames.com/embed/basket-random",
    "https://www.crazygames.com/embed/slope",
    "https://www.crazygames.com/embed/tetris",
    "https://www.crazygames.com/embed/wordle"
  ];

  function shuffleGame() {
    const frame = document.getElementById("mini-game-frame");
    if (!frame) return;
    const randomGame = gamePool[Math.floor(Math.random() * gamePool.length)];
    frame.src = randomGame;
  }

  // Load a random game on initialization
  document.addEventListener("DOMContentLoaded", () => {
    shuffleGame();
  });
</script>
<!-- END GAME STRIP COMPONENT -->
