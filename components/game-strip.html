<!-- GAME STRIP COMPONENT -->
<div class="game-strip-container">
  <div class="game-strip-inner">
    <div class="game-strip-header">
      <h3 class="game-strip-title">🎮 Take a Break &amp; Play!</h3>
      <div style="display:flex;align-items:center;gap:10px;">
        <span id="game-strip-name" style="font-size:0.8rem;color:var(--text-muted);"></span>
        <button class="game-strip-shuffle" onclick="shuffleGame()">🎲 New Game</button>
      </div>
    </div>
    <div class="game-strip-frame-wrap">
      <iframe
        id="mini-game-frame"
        allow="gamepad *; fullscreen *"
        scrolling="no"
        frameborder="0"
        loading="lazy"
        title="Free mini-game"
      ></iframe>
    </div>
    <p class="game-strip-footer">Free browser games — no download, no sign-up. Click "New Game" to shuffle to a different one.</p>
  </div>
</div>

<script>
(function() {
  var games = [
    { name: "2048", url: "https://www.crazygames.com/embed/2048" },
    { name: "Uno Online", url: "https://www.crazygames.com/embed/uno-online" },
    { name: "Smash Karts", url: "https://www.crazygames.com/embed/smash-karts" },
    { name: "Cubes 2048", url: "https://www.crazygames.com/embed/cubes-2048-io" },
    { name: "Basket Random", url: "https://www.crazygames.com/embed/basket-random" },
    { name: "Slope", url: "https://www.crazygames.com/embed/slope" },
    { name: "Tetris", url: "https://www.crazygames.com/embed/tetris" },
    { name: "Wordle", url: "https://www.crazygames.com/embed/wordle" },
    { name: "Moto X3M", url: "https://www.crazygames.com/embed/moto-x3m" },
    { name: "Subway Surfers", url: "https://www.crazygames.com/embed/subway-surfers" },
    { name: "Snake", url: "https://www.crazygames.com/embed/snake-io" },
    { name: "Bob The Robber", url: "https://www.crazygames.com/embed/bob-the-robber" },
    { name: "Fireboy & Watergirl", url: "https://www.crazygames.com/embed/fireboy-and-watergirl-in-the-forest-temple" },
    { name: "Stickman Hook", url: "https://www.crazygames.com/embed/stickman-hook" },
    { name: "Drift Boss", url: "https://www.crazygames.com/embed/drift-boss" },
    { name: "Pizza Clicker", url: "https://www.crazygames.com/embed/pizza-clicker" },
    { name: "Dino Game", url: "https://www.crazygames.com/embed/dino-game" },
    { name: "Vex 5", url: "https://www.crazygames.com/embed/vex-5" },
    { name: "Gold Miner", url: "https://www.crazygames.com/embed/gold-miner" },
    { name: "Crossy Road", url: "https://www.crazygames.com/embed/crossy-road" },
    { name: "Flappy Bird", url: "https://www.crazygames.com/embed/flappy-bird" },
    { name: "Traffic Jam 3D", url: "https://www.crazygames.com/embed/traffic-jam-3d" },
    { name: "Tiny Fishing", url: "https://www.crazygames.com/embed/tiny-fishing" },
    { name: "Stack Ball", url: "https://www.crazygames.com/embed/stack-ball" },
    { name: "Word Search", url: "https://www.crazygames.com/embed/word-search" },
    { name: "Solitaire", url: "https://www.crazygames.com/embed/solitaire" },
    { name: "Mahjong Classic", url: "https://www.crazygames.com/embed/mahjong-classic" },
    { name: "Bubble Shooter", url: "https://www.crazygames.com/embed/bubble-shooter" },
    { name: "Fruit Ninja", url: "https://www.crazygames.com/embed/fruit-ninja" },
    { name: "Raft Wars", url: "https://www.crazygames.com/embed/raft-wars" },
    { name: "Bad Ice Cream", url: "https://www.crazygames.com/embed/bad-ice-cream" },
    { name: "Bloons Tower Defense", url: "https://www.crazygames.com/embed/bloons-tower-defense" },
    { name: "Parking Fury", url: "https://www.crazygames.com/embed/parking-fury" },
    { name: "Run 3", url: "https://www.crazygames.com/embed/run-3" },
    { name: "Penalty Shooters", url: "https://www.crazygames.com/embed/penalty-shooters-2" }
  ];

  var lastIndex = -1;

  function shuffleGame() {
    var frame = document.getElementById('mini-game-frame');
    var label = document.getElementById('game-strip-name');
    if (!frame) return;
    var idx;
    do { idx = Math.floor(Math.random() * games.length); } while (idx === lastIndex && games.length > 1);
    lastIndex = idx;
    var game = games[idx];
    frame.src = game.url;
    if (label) label.textContent = game.name;
  }

  // Expose globally for onclick
  window.shuffleGame = shuffleGame;

  // Load a random game on initialization
  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', shuffleGame);
  } else {
    shuffleGame();
  }
})();
</script>
<!-- END GAME STRIP COMPONENT -->
