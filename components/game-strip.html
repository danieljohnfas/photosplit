<script>
(function() {
  window.arcadeGamesList = [
    { name: "Moto X3M", url: "https://www.crazygames.com/embed/moto-x3m", icon: "🏍️" },
    { name: "Subway Surfers", url: "https://www.crazygames.com/embed/subway-surfers", icon: "🛹" },
    { name: "Snake", url: "https://www.crazygames.com/embed/snake-io", icon: "🐍" },
    { name: "Fireboy & Watergirl", url: "https://www.crazygames.com/embed/fireboy-and-watergirl-in-the-forest-temple", icon: "🔥💧" },
    { name: "2048", url: "https://www.crazygames.com/embed/2048", icon: "🔢" },
    { name: "Uno Online", url: "https://www.crazygames.com/embed/uno-online", icon: "🎴" },
    { name: "Smash Karts", url: "https://www.crazygames.com/embed/smash-karts", icon: "🏎️" },
    { name: "Basket Random", url: "https://www.crazygames.com/embed/basket-random", icon: "🏀" },
    { name: "Slope", url: "https://www.crazygames.com/embed/slope", icon: "🟢" },
    { name: "Tetris", url: "https://www.crazygames.com/embed/tetris", icon: "🧱" },
    { name: "Wordle", url: "https://www.crazygames.com/embed/wordle", icon: "📝" },
    { name: "Stickman Hook", url: "https://www.crazygames.com/embed/stickman-hook", icon: "🪝" },
    { name: "Drift Boss", url: "https://www.crazygames.com/embed/drift-boss", icon: "🚗" },
    { name: "Dino Game", url: "https://www.crazygames.com/embed/dino-game", icon: "🦖" },
    { name: "Crossy Road", url: "https://www.crazygames.com/embed/crossy-road", icon: "🐔" },
    { name: "Flappy Bird", url: "https://www.crazygames.com/embed/flappy-bird", icon: "🦅" }
  ];

  let currentSlotGames = [];

  window.shuffleGames = function() {
    let list = window.arcadeGamesList;
    let selected = [];
    while(selected.length < 4) {
      let idx = Math.floor(Math.random() * list.length);
      if(!selected.includes(list[idx])) {
        selected.push(list[idx]);
      }
    }
    
    currentSlotGames = selected;
    
    for(let i=1; i<=4; i++) {
      const g = currentSlotGames[i-1];
      const iconEl = document.getElementById('game-icon-' + i);
      const nameEl = document.getElementById('game-name-' + i);
      if(iconEl && nameEl) {
        iconEl.textContent = g.icon;
        nameEl.textContent = g.name;
      }
    }
  };

  window.openGlobalGame = function(slotIndex) {
    if(!currentSlotGames[slotIndex]) return;
    const game = currentSlotGames[slotIndex];
    const modal = document.getElementById('global-game-modal');
    const iframe = document.getElementById('global-game-iframe');
    const title = document.getElementById('global-game-title');
    if(modal && iframe) {
      title.textContent = game.name;
      iframe.src = game.url;
      modal.style.display = 'flex';
      document.body.style.overflow = 'hidden';
    }
  };

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', window.shuffleGames);
  } else {
    window.shuffleGames();
  }
})();
</script>
