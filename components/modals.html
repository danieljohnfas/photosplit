<!-- MODALS START -->
<div
  class="text-modal-backdrop"
  id="feedback-modal"
  onclick="
    if (event.target === this && typeof closeTextModal === 'function')
      closeTextModal('feedback-modal');
  "
>
  <div class="text-modal-box">
    <div class="text-modal-header">
      <h2>Provide Feedback</h2>
      <button
        class="icon-btn"
        onclick="
          if (typeof closeTextModal === 'function')
            closeTextModal('feedback-modal');
        "
      >
        ✕
      </button>
    </div>
    <div class="text-modal-content" id="feedback-form-view">
      <form
        onsubmit="
          if (typeof handleFeedbackSubmit === 'function')
            handleFeedbackSubmit(event);
        "
      >
        <input
          class="form-control mb-12"
          id="fb-name"
          placeholder="Your Name"
          required=""
          type="text"
          style="margin-bottom: 12px"
        />
        <input
          class="form-control mb-12"
          id="fb-email"
          placeholder="your@email.com"
          required=""
          type="email"
          style="margin-bottom: 12px"
        />
        <textarea
          class="form-control mb-12"
          id="fb-desc"
          placeholder="Your feedback..."
          required=""
          rows="4"
          style="margin-bottom: 12px"
        ></textarea>
        <button class="btn btn-primary" style="width: 100%" type="submit">
          Submit
        </button>
      </form>
    </div>
    <div
      class="text-modal-content"
      id="feedback-success-view"
      style="display: none; text-align: center"
    >
      <h3>✅ Thank you!</h3>
      <p>Your feedback has been received.</p>
      <button
        class="btn btn-secondary"
        onclick="
          if (typeof closeTextModal === 'function')
            closeTextModal('feedback-modal');
        "
      >
        Close
      </button>
    </div>
  </div>
</div>

<div id="cookie-consent" role="dialog">
  <div id="cookie-consent-inner">
    <p>
      🍪 We use cookies to improve your experience. See our
      <a href="/privacy-policy">Privacy Policy</a>.
    </p>
    <div id="cookie-consent-actions">
      <button class="cookie-btn" id="cookie-decline">Decline</button>
      <button class="cookie-btn cookie-btn-accept" id="cookie-accept">
        Accept All
      </button>
    </div>
  </div>
</div>

<script>
  (function () {
    if (!localStorage.getItem("ps_counted")) {
      localStorage.setItem("ps_counted", "true");
      var img = new Image();
      img.src =
        "https://hitscounter.dev/api/hit?url=https%3A%2F%2Fphotosplitstudio.com&label=Visits&color=%23002d72&style=flat-square&tz=UTC";
    }

    window.handleFeedbackSubmit = function (e) {
      e.preventDefault();
      var params = new URLSearchParams();
      params.append(
        "entry.1051903221",
        document.getElementById("fb-name").value,
      );
      params.append(
        "entry.371950700",
        document.getElementById("fb-email").value,
      );
      params.append(
        "entry.852578852",
        document.getElementById("fb-desc").value,
      );
      fetch(
        "https://docs.google.com/forms/d/e/1FAIpQLSeJe_jw0IHHXeT4w4hzcZJ2WXREaT8aD4_R4LFBGVZNazsehg/formResponse",
        { method: "POST", mode: "no-cors", body: params },
      );
      document.getElementById("feedback-form-view").style.display = "none";
      document.getElementById("feedback-success-view").style.display = "block";
    };

    // Cookie Consent
    var banner = document.getElementById("cookie-consent");
    if (banner) {
      if (!localStorage.getItem("pss_cookie_consent")) {
        banner.classList.add("visible");
      } else if (localStorage.getItem("pss_cookie_consent") === "accepted") {
        if (typeof loadGoogleScripts === "function") loadGoogleScripts();
        if (typeof loadGoogleAnalytics === "function") loadGoogleAnalytics();
      }
      var acceptBtn = document.getElementById("cookie-accept");
      if (acceptBtn) {
        acceptBtn.onclick = function () {
          localStorage.setItem("pss_cookie_consent", "accepted");
          banner.classList.remove("visible");
          if (typeof loadGoogleScripts === "function") loadGoogleScripts();
          if (typeof loadGoogleAnalytics === "function") loadGoogleAnalytics();
        };
      }
      var declineBtn = document.getElementById("cookie-decline");
      if (declineBtn) {
        declineBtn.onclick = function () {
          localStorage.setItem("pss_cookie_consent", "declined");
          banner.classList.remove("visible");
        };
      }
    }
  })();
</script>

<!-- GLOBAL GAME MODAL -->
<style>
  #global-game-modal {
    display: none;
    position: fixed;
    inset: 0;
    z-index: 99999;
    background: rgba(0,0,0,0.95);
    backdrop-filter: blur(15px);
    align-items: center;
    justify-content: center;
  }
  .global-game-content {
    width: 100%;
    max-width: 1400px;
    height: 90vh;
    background: var(--bg-surface);
    border-radius: var(--radius-lg);
    display: flex;
    flex-direction: column;
    overflow: hidden;
    box-shadow: 0 20px 60px rgba(0,0,0,0.5);
  }
  .global-game-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 16px 24px;
    background: var(--bg-surface-2);
    border-bottom: 1px solid var(--border);
  }
  .close-global-game-btn {
    background: rgba(254,44,85,0.15);
    border: 1px solid rgba(254,44,85,0.3);
    color: #fe2c55;
    padding: 8px 24px;
    border-radius: 99px;
    cursor: pointer;
    font-weight: 700;
    transition: all 0.2s;
  }
  .close-global-game-btn:hover {
    background: #fe2c55;
    color: white;
  }
</style>

<div id="global-game-modal">
  <div class="global-game-content">
    <div class="global-game-header">
      <h3 id="global-game-title" style="margin:0; font-size: 1.4rem; font-weight: 800;">Arcade</h3>
      <button class="close-global-game-btn" onclick="closeGlobalGame()">✖ Close Game</button>
    </div>
    <iframe id="global-game-iframe" style="flex: 1; width: 100%; border: none;" allow="gamepad *; fullscreen *" scrolling="no"></iframe>
  </div>
</div>

<script>
  window.closeGlobalGame = function() {
    const modal = document.getElementById('global-game-modal');
    const iframe = document.getElementById('global-game-iframe');
    if(modal && iframe) {
      iframe.src = '';
      modal.style.display = 'none';
      document.body.style.overflow = '';
    }
  };
</script>
<!-- MODALS END -->
